# Supabase ücretsiz projesi 1 hafta hareketsiz kalınca duraklatılır.
# Bu görev her gün veritabanına küçük bir istek atarak projeyi uyanık tutar.
name: Supabase uyanık tut
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
permissions:
  actions: write
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Supabase'e istek at
        run: |
          curl -sS -o /dev/null -w "%{http_code}\n" \
            "https://yenselnewdytltddwpvm.supabase.co/rest/v1/journal?select=user_id&limit=1" \
            -H "apikey: sb_publishable_fgyTeoNz8eV0Vst0cnnuZA__aoVUsKf"
      # GitHub, depoda 60 gün hiç hareket olmazsa zamanlı görevleri kapatır.
      # Bu adım görevi her çalıştığında yeniden etkinleştirerek o sayacı sıfırlar.
      - name: Zamanlayıcıyı canlı tut
        run: |
          curl -sS -o /dev/null -w "%{http_code}\n" -X PUT \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/keepalive.yml/enable"
