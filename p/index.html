*{box-sizing:border-box}

.w{max-width:440px;margin:0 auto}
.top{display:flex;align-items:center;gap:10px;margin-bottom:18px}

.card{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:18px;margin-bottom:12px}
.mu{color:var(--mu)}

.g{color:var(--g)}.r{color:var(--r)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.grid div{background:#000;border:1px solid var(--bd);border-radius:12px;padding:10px 12px}
.grid small{display:block;color:var(--mu);font-size:12px}
.grid b{font-size:18px}
.row{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-top:1px solid var(--bd);font-size:14px;gap:10px}
.bar{height:6px;border-radius:3px}

.note{white-space:pre-wrap;font-size:14.5px;line-height:1.5;margin-top:12px;padding-top:12px;border-top:1px solid var(--bd)}
